{% extends 'layout/base.html' %}

{% block title %}Đăng ký tài khoản{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center h-100 mt-5">
    <div class="w-100" style="max-width: 700px;">
        <h1 class="text-primary text-center">Đăng ký tài khoản</h1>
        {% if err_msg %}
        <div class="alert alert-warning">{{err_msg}}</div>
        {% endif %}
        <form method="post" action="/register">
            <div class="mb-3 mt-3">
                <label for="name" class="form-label">Tên của bạn:</label>
                <input type="text" class="form-control" id="name" placeholder="Tên của bạn" value="{{name or ''}}" name="name" required/>
            </div>
            <div class="mb-3 mt-3">
                <label for="username" class="form-label">Tên tài khoản:</label>
                <input type="text" class="form-control" id="username" placeholder="Tên tài khoản" value="{{username or ''}}" name="username" required/>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu:</label>
                <input type="password" class="form-control" id="password" placeholder="Mật khẩu" name="password" required/>
            </div>
            <div class="mb-3">
                <label for="confirm-password" class="form-label">Nhập lại mật khẩu:</label>
                <input type="password" class="form-control" id="confirm-password" placeholder="Mật khẩu" name="confirm-password" required/>
            </div>
            <button type="submit" class="btn btn-primary">Đăng ký</button>
        </form>
    </div>
</div>
{% endblock %}
