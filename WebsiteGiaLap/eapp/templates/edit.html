{% extends 'layout/base.html' %}

{% block title %}Sửa bài viết{% endblock %}

{% block content %}
<style>
    .post-content {
        white-space: pre-wrap;
    }
</style>
<div class="d-flex justify-content-center align-items-center h-100 mt-5 mb-5">
    <div class="w-100" style="max-width: 1000px;">
        <h1 class="text-primary text-center">Sửa bài viết</h1>
        {% if err_msg %}
        <div class="alert alert-warning">{{err_msg}}</div>
        {% endif %}
        <form method="post" action="/discuss/post/edit">
            <input type="hidden" name="post_id" value="{{ post.id }}">
            <div class="mb-3 mt-3">
                <label for="title" class="form-label">Tiêu đề:</label>
                <input type="text" class="form-control" id="title" placeholder="Tiêu đề" value="{{post.title}}" name="title"/>
            </div>
            <div class="mb-3 mt-3">
                <label for="content">Nội dung:</label>
                <textarea class="form-control post-content" rows="25" id="content" placeholder="Nội dung" name="content">{{post.content}}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Cập nhật bài viết</button>
            <a class="btn btn-danger" href="/discuss/post?id={{post.id}}">Hủy</a>
        </form>
    </div>
</div>
{% endblock %}
