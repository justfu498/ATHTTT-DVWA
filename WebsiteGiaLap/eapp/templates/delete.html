{% extends 'layout/base.html' %}

{% block title %}Xác nhận xóa bài viết{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center h-100 mt-5 mb-5">
    <div class="w-100" style="max-width: 700px;">
        <h1 class="text-danger text-center">Xóa bài viết</h1>
        <form method="post" action="/discuss/post/delete">
            <input type="hidden" name="post_id" value="{{ post.id }}">
            <h5 class="text-center">Khi xác nhận, bài viết sẽ bị xóa vĩnh viễn không thể khôi phục</h5>
            <h5 class="text-center">Bạn có thực sự muốn xóa?</h5>
            <div class="d-flex justify-content-center gap-2">
                <button type="submit" class="btn btn-primary">Xác nhận</button>
                <a class="btn btn-danger" href="/discuss/post?id={{post.id}}">Hủy</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
