{% extends 'layout/base.html' %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center h-100 mt-5">
    <div class="w-100" style="max-width: 700px;">
        <h1 class="text-primary text-center">Đăng nhập tài khoản</h1>
        {% if err_msg %}
        <div class="alert alert-warning">{{err_msg}}</div>
        {% endif %}
        <form method="post" action="/login">
            <div class="mb-3 mt-3">
                <label for="username" class="form-label">Tên tài khoản:</label>
                <input type="text" class="form-control" id="username" placeholder="Tên tài khoản" name="username"/>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu:</label>
                <input type="password" class="form-control" id="password" placeholder="Mật khẩu" name="password"/>
            </div>
            <button type="submit" class="btn btn-primary">Đăng nhập</button>
        </form>
    </div>
</div>
{% endblock %}
