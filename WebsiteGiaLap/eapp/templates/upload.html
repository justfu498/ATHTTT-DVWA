{% extends 'layout/base.html' %}

{% block title %}Đăng bài viết{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center h-100 mt-5 mb-5">
    <div class="w-100" style="max-width: 1000px;">
        <h1 class="text-primary text-center">Đăng bài viết</h1>
        {% if err_msg %}
        <div class="alert alert-warning">{{err_msg}}</div>
        {% endif %}
        <form method="post" action="/discuss/upload">
            <div class="mb-3 mt-3">
                <label for="title" class="form-label">Tiêu đề:</label>
                <input type="text" class="form-control" id="title" placeholder="Tiêu đề" name="title"/>
            </div>
            <div class="mb-3 mt-3">
                <label for="content">Nội dung:</label>
                <textarea class="form-control" rows="25" id="content" placeholder="Nội dung" name="content"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Đăng bài</button>
            <a class="btn btn-danger" href="/discuss">Hủy</a>
        </form>
    </div>
</div>
{% endblock %}
